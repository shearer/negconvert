name: Build install files

# Manual runs always work (dispatch); pushing a "v*" tag also builds and
# names the artifacts after that version. Builds are unsigned - macOS shows
# an "unidentified developer" warning (right-click -> Open once bypasses
# it) and Windows shows a similar SmartScreen warning.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Qt runtime dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libxcb-shm0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.6"

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Windows .ico
        if: matrix.name == 'windows'
        shell: bash
        run: |
          python -c "
          from PIL import Image
          Image.open('assets/icon_1024.png').save(
              'assets/NegConvert.ico',
              sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)],
          )"

      - name: Build with PyInstaller
        run: pyinstaller NegConvert.spec

      - name: Package macOS .dmg
        if: matrix.name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-installers dist/dmg-root
          cp -R dist/NegConvert.app dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname "NegConvert" -srcfolder dist/dmg-root -ov -format UDZO \
            "dist-installers/NegConvert-${{ steps.version.outputs.version }}-macos.dmg"

      - name: Install Inno Setup
        if: matrix.name == 'windows'
        run: choco install innosetup -y --no-progress

      - name: Package Windows installer
        if: matrix.name == 'windows'
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\negconvert.iss /DAppVersion=${{ steps.version.outputs.version }}

      - name: Package Linux AppImage
        if: matrix.name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-installers
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          cp -R dist/NegConvert AppDir/usr/bin/NegConvert
          cp packaging/linux/negconvert.desktop AppDir/NegConvert.desktop
          cp assets/icon_1024.png AppDir/negconvert.png
          cp packaging/linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir \
            "dist-installers/NegConvert-${{ steps.version.outputs.version }}-linux-x86_64.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NegConvert-${{ matrix.name }}
          path: dist-installers/*
          if-no-files-found: error
