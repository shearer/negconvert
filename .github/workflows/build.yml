name: Build install files

# Manual runs always work (dispatch) but only build - they upload to the
# Actions run as artifacts, not anywhere else, since there's no tag to
# attach a release to. Pushing a "v*" tag builds AND publishes a GitHub
# Release for that tag with the installers attached as assets. Builds are
# unsigned - macOS shows an "unidentified developer" warning (right-click
# -> Open once bypasses it) and Windows shows a similar SmartScreen warning.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

env:
  # Run JS actions on Node 24 ahead of GitHub's mandatory cutover (Node 20
  # is removed from runners in September 2026) - actions/checkout,
  # setup-python, and upload-artifact below are already pinned to
  # Node24-declaring major versions, this just covers everything else too.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            name: macos-arm64
          - os: macos-15-intel
            platform: macos
            name: macos-intel
          - os: windows-latest
            platform: windows
            name: windows
          - os: ubuntu-latest
            platform: linux
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux Qt runtime dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libxcb-shm0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.6"

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Windows .ico
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          python -c "
          from PIL import Image
          Image.open('assets/icon_1024.png').save(
              'assets/NegConvert.ico',
              sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)],
          )"

      - name: Build with PyInstaller
        run: pyinstaller NegConvert.spec

      - name: Package macOS .dmg
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-installers dist/dmg-root
          cp -R dist/NegConvert.app dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname "NegConvert" -srcfolder dist/dmg-root -ov -format UDZO \
            "dist-installers/NegConvert-${{ steps.version.outputs.version }}-${{ matrix.name }}.dmg"

      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        run: choco install innosetup -y --no-progress

      - name: Package Windows installer
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\negconvert.iss /DAppVersion=${{ steps.version.outputs.version }}

      - name: Package Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-installers
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          cp -R dist/NegConvert AppDir/usr/bin/NegConvert
          cp packaging/linux/negconvert.desktop AppDir/NegConvert.desktop
          cp assets/icon_1024.png AppDir/negconvert.png
          cp packaging/linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir \
            "dist-installers/NegConvert-${{ steps.version.outputs.version }}-linux-x86_64.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: NegConvert-${{ matrix.name }}
          path: dist-installers/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" artifacts/*/* --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes
          fi
